[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-scanner"
version = "0.37.0"
description = "Desktop SDR spectrum, scanner and passive drone-band monitor for Pluto+, HackRF One and IQ files"
readme = "README.md"
license = {text = "GPL-3.0-only"}
authors = [{name = "SDR Scanner contributors"}]
requires-python = ">=3.10"
keywords = [
    "SDR", "ADALM-PLUTO", "Pluto+", "HackRF", "spectrum", "scanner",
    "drone", "RF",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
hardware = ["pyadi-iio>=0.0.21"]
ml = ["h5py>=3.10"]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[project.scripts]
sdr-scanner = "sdr_scanner.__main__:main"

[tool.setuptools.packages.find]
include = ["sdr_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
